<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulta de Preço - Binance</title>
    <link rel="stylesheet" href="conversao-criptomoedas.css" />
    <script defer src="conversao-criptomoedas.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Consultar Preço de Moedas</h1>

      <label for="moedaBase">Moeda Base (Ex.: BTC):</label>
      <input
        type="text"
        id="moedaBase"
        placeholder="Digite a moeda base"
        list="listaMoedasBase"
      />

      <label for="moedaConversao">Moeda Conversão (Ex.: USDT):</label>
      <input
        type="text"
        id="moedaConversao"
        placeholder="Digite a moeda de conversão"
        list="listaMoedasConversao"
      />

      <datalist id="listaMoedasBase">
        <option value="BTC"></option>
        <option value="ETH"></option>
        <option value="SOL"></option>
        <option value="XRP"></option>
        <option value="DOGE"></option>
      </datalist>

      <datalist id="listaMoedasConversao">
        <option value="USDT"></option>
        <option value="BRL"></option>
      </datalist>

      <div class="grupo-botoes">
        <button id="botaoConsultar">Consultar</button>
        <button id="botaoInverter" class="btn-secundario">⇄ Inverter</button>
        <button id="botaoLimpar" class="btn-secundario">✕ Limpar</button>
      </div>

      <div id="resultado"></div>
    </div>
  </body>
</html>
